<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المشتركين | عارضتي</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0a0a0a;--card:#141414;--gold:#d4af37;--text:#f5f0e6;--muted:#a0a0a0;--border:rgba(212,175,55,0.25);--green:#2e7d32;--red:#c62828}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:1.5rem}
h1{color:var(--gold);text-align:center;font-size:1.5rem;margin-bottom:0.4rem}
.sub{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem;max-width:560px;margin:0 auto 1.2rem}
label{display:block;font-size:0.85rem;color:var(--muted);margin:0.7rem 0 0.25rem}
input,select{width:100%;padding:0.7rem 1rem;border-radius:10px;border:1px solid var(--border);background:#0f0f0f;color:var(--text);font-size:0.95rem;outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--gold)}
button{width:100%;padding:0.85rem;border-radius:10px;border:none;background:linear-gradient(135deg,var(--gold),#b8860b);color:#0a0a0a;font-weight:800;font-size:1rem;cursor:pointer;margin-top:1rem;font-family:inherit}
button:active{transform:scale(0.98)}
.msg{text-align:center;padding:0.8rem;border-radius:10px;margin-top:0.9rem;font-weight:700;display:none}
.msg.ok{display:block;background:rgba(46,125,50,0.15);color:#7ddb85;border:1px solid var(--green)}
.msg.err{display:block;background:rgba(198,40,40,0.15);color:#ff8a80;border:1px solid var(--red)}
table{width:100%;border-collapse:collapse;margin-top:0.8rem;font-size:0.85rem}
th,td{padding:0.5rem 0.4rem;border-bottom:1px solid var(--border);text-align:right}
th{color:var(--gold);font-weight:700}
td{color:var(--text)}
.badge{padding:0.15rem 0.6rem;border-radius:50px;font-size:0.75rem;font-weight:700}
.badge.on{background:rgba(46,125,50,0.2);color:#7ddb85}
.badge.off{background:rgba(198,40,40,0.2);color:#ff8a80}
small{color:var(--muted)}
</style>
</head>
<body>

<h1>👑 لوحة تحكم عارضتي</h1>
<p class="sub">التحقق من عمليات بريدي موب / الذهبية وتفعيل المشتركين</p>

<!-- بوابة الدخول -->
<div class="card" id="gate">
    <label>🔑 رمز الدخول</label>
    <input type="password" id="code" placeholder="أدخل الرمز السري">
    <button onclick="unlock()">دخول</button>
    <div class="msg err" id="gateMsg">رمز خاطئ</div>
</div>

<!-- المحتوى -->
<div id="panel" style="display:none">
    <div class="card">
        <h3 style="color:var(--gold);margin-bottom:0.3rem">✅ تفعيل مشترك جديد</h3>
        <small>بعد التأكد من العملية في Chargily ← سجل المعاملات</small>
        <label>إيميل العميل (من سجل المعاملات)</label>
        <input type="email" id="aEmail" placeholder="email@example.com">
        <label>الاسم (اختياري)</label>
        <input type="text" id="aName" placeholder="اسم العميل">
        <label>الطريقة</label>
        <select id="aMethod">
            <option value="chargily">بريدي موب / البطاقة الذهبية</option>
            <option value="paypal">PayPal</option>
        </select>
        <label>رقم العملية — Order ID (اختياري، للأرشفة)</label>
        <input type="text" id="aOrder" placeholder="chk_... / 8AB...">
        <button onclick="activate()">⚡ تفعيل الاشتراك شهراً كاملاً</button>
        <div class="msg" id="actMsg"></div>
    </div>

    <div class="card">
        <h3 style="color:var(--gold)">⏳ طلبات التفعيل المعلقة <button style="width:auto;padding:0.3rem 1rem;font-size:0.8rem;margin:0;float:left" onclick="loadClaims()">🔄 تحديث</button></h3>
        <small>تحقق من رقم العملية في تطبيق بريدي موب ثم اضغط تأكيد</small>
        <div id="claimsList"><small>اضغط تحديث لعرض الطلبات</small></div>
    </div>

    <div class="card">
        <h3 style="color:var(--gold)">📋 المشتركون <button style="width:auto;padding:0.3rem 1rem;font-size:0.8rem;margin:0;float:left" onclick="loadSubs()">🔄 تحديث</button></h3>
        <div id="subsList"><small>اضغط تحديث لعرض القائمة</small></div>
    </div>
</div>

<script>
// 🔐 رمز الإدارة — لا تشاركه مع أحد
const ADMIN_CODE = 'midou1987mm';
const SUPABASE_URL = 'https://mkgsewcvfftilcdatgqg.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_sSZbTaNKIwMEzhPQhPnE3g_Xj-xsNZP';

function unlock(){
    if(document.getElementById('code').value === ADMIN_CODE){
        document.getElementById('gate').style.display='none';
        document.getElementById('panel').style.display='block';
        loadSubs();
        loadClaims();
    } else {
        document.getElementById('gateMsg').style.display='block';
    }
}

async function sbRpc(fn, params){
    const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
        method:'POST',
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},
        body:JSON.stringify(params)
    });
    if(!r.ok) throw new Error(fn + ' HTTP ' + r.status);
    return r.json();
}

async function activate(){
    const email = document.getElementById('aEmail').value.trim();
    const msg = document.getElementById('actMsg');
    if(!email || !email.includes('@')){ msg.className='msg err'; msg.textContent='أدخل إيميلاً صحيحاً'; return; }
    try{
        await sbRpc('register_subscriber', {
            p_email: email,
            p_name: document.getElementById('aName').value.trim(),
            p_phone: '',
            p_method: document.getElementById('aMethod').value,
            p_amount: document.getElementById('aMethod').value==='paypal' ? '15 USD' : '3500 DZD',
            p_order_id: document.getElementById('aOrder').value.trim()
        });
        msg.className='msg ok'; msg.textContent='✅ تم التفعيل! العميل يفعّل بإيميله من الموقع الآن';
        document.getElementById('aEmail').value=''; document.getElementById('aOrder').value='';
        loadSubs();
    }catch(e){ msg.className='msg err'; msg.textContent='❌ خطأ: ' + e.message; }
}

async function loadClaims(){
    const r = await fetch(SUPABASE_URL + '/rest/v1/payment_claims?select=id,email,tx_ref,created_at&status=eq.pending&order=created_at.desc', {
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
    });
    const rows = await r.json();
    const box = document.getElementById('claimsList');
    if(!Array.isArray(rows) || !rows.length){ box.innerHTML='<small style="color:#7ddb85">✅ لا توجد طلبات معلقة</small>'; return; }
    let h = '<table><tr><th>الإيميل</th><th>رقم العملية</th><th></th></tr>';
    rows.forEach(c=>{
        h += '<tr><td>'+(c.email||'')+'</td><td style="direction:ltr;text-align:left">'+(c.tx_ref||'')+'</td>'
           + '<td><button style="width:auto;padding:0.3rem 0.8rem;font-size:0.8rem;margin:0;background:linear-gradient(135deg,#43a047,#2e7d32)" onclick="approve(\''+c.id+'\')">✅ تأكيد</button></td></tr>';
    });
    box.innerHTML = h + '</table>';
}

async function approve(id){
    if(!confirm('تأكيد استلام 3500 د.ج وتفعيل هذا المشترك؟')) return;
    try{
        const r = await fetch(SUPABASE_URL + '/rest/v1/rpc/approve_claim', {
            method:'POST',
            headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY,'Content-Type':'application/json'},
            body:JSON.stringify({p_id:id, p_code:ADMIN_CODE})
        });
        const ok = await r.json();
        if(ok===true){ alert('✅ تم التفعيل! سيُفعَّل جهاز العميل تلقائياً.'); loadClaims(); loadSubs(); }
        else alert('❌ فشل التأكيد');
    }catch(e){ alert('❌ خطأ: '+e.message); }
}

async function loadSubs(){
    const r = await fetch(SUPABASE_URL + '/rest/v1/subscribers?select=email,name,method,amount,status,created_at&order=created_at.desc', {
        headers:{'apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY}
    });
    const rows = await r.json();
    const box = document.getElementById('subsList');
    if(!Array.isArray(rows) || !rows.length){ box.innerHTML='<small>لا يوجد مشتركون بعد</small>'; return; }
    let h = '<table><tr><th>الإيميل</th><th>الطريقة</th><th>المبلغ</th><th>الحالة</th></tr>';
    rows.forEach(s=>{
        h += '<tr><td>'+ (s.email||'') +'<br><small>'+(s.name||'')+'</small></td><td>'+(s.method||'')+'</td><td>'+(s.amount||'')+'</td><td><span class="badge '+(s.status==='active'?'on':'off')+'">'+(s.status==='active'?'فعّال':'منتهي')+'</span></td></tr>';
    });
    box.innerHTML = h + '</table>';
}
</script>
</body>
</html>
